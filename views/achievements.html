{{template "partials/head" .}}
<body class="min-h-screen text-slate-100">

{{template "partials/nav" .}}

<main class="mx-auto max-w-6xl px-5 py-10" x-data="achievements()" x-init="init()" x-cloak>
  <h1 class="text-3xl font-bold">Achievements</h1>
  <p class="mt-2 text-sm text-slate-400">
    Signed in as <strong class="text-slate-200" x-text="'@' + viewerLogin"></strong>.
    You can also inspect anyone else's unlocked achievements.
  </p>

  <div class="card mt-6 rounded-2xl p-5">
    <div class="flex flex-col gap-3 sm:flex-row">
      <div class="relative flex-1">
        <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">@</span>
        <input x-model="username" @keydown.enter="load()" placeholder="torvalds"
               class="w-full rounded-xl border border-slate-700 bg-slate-900/70 py-3 pl-8 pr-3 outline-none focus:border-pink-300/60" />
      </div>
      <button @click="load()" :disabled="loading"
              class="rounded-xl bg-gradient-to-r from-pink-300 to-purple-300 px-6 py-3 font-semibold text-slate-900 disabled:opacity-40">
        <span x-show="!loading">Load achievements</span>
        <span x-show="loading">Loading…</span>
      </button>
    </div>
    <p class="mt-3 text-sm text-rose-300" x-show="error" x-text="error"></p>
    <p class="mt-3 text-sm text-slate-400" x-show="!error && loaded && !unlockedCount">
      Nothing unlocked yet for this profile. It may not have been analyzed. Try
      <a class="text-pink-200 hover:underline" :href="'/api/analyze'">running an analysis</a> first.
    </p>
    <p class="mt-3 text-sm text-emerald-300" x-show="!error && loaded && unlockedCount"
       x-text="unlockedCount + ' of ' + achievements.length + ' unlocked'"></p>
  </div>

  <div class="mt-8 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    <template x-for="a in achievements" :key="a.key">
      <div class="rounded-2xl p-4" :class="a.unlocked ? ('tier-' + a.tier) : 'card locked'"
           :title="a.hint">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="text-2xl" x-text="a.icon"></p>
            <p class="mt-1 font-semibold" x-text="a.name"></p>
            <p class="text-[11px] uppercase tracking-wide opacity-70" x-text="a.category"></p>
          </div>
          <span class="rounded-full px-2 py-0.5 text-[10px] uppercase"
                :class="a.unlocked ? 'bg-black/25' : 'bg-slate-800 text-slate-400'"
                x-text="a.unlocked ? a.tier : 'locked'"></span>
        </div>
        <p class="mt-3 text-xs opacity-80" x-text="a.hint"></p>
      </div>
    </template>
  </div>
</main>

{{template "partials/footer" .}}


<!-- identity bootstrap; logic lives in /public/achievements.js -->
<script>
window.ACH_INIT = { username: "{{.Username}}", viewerLogin: "{{.ViewerLogin}}" };
</script>
<script src="/public/achievements.js"></script>
</body>
</html>
